<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The Wedding of Ahmad & Susanti</title>

    <!-- Meta Tag Open Graph untuk Preview Gambar & Deskripsi di WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://undangan-ahmad-susanti.vercel.app/" />
    <meta property="og:title" content="The Wedding of Ahmad & Susanti" />
    <meta property="og:description" content="Undangan pernikahan Ahmad & Susanti - Klik untuk membuka." />
    <meta property="og:image" content="https://undangan-ahmad-susanti.vercel.app/sampul.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />

    <link rel="stylesheet" href="style.css" />
</head>

<body class="lock-scroll">

    <!-- Background Blur Khusus Tampilan Laptop/PC -->
    <div class="desktop-backdrop"></div>

    <!-- Bingkai Utama -->
    <div class="app-frame">

        <!-- 1. SAMPUL GAMBAR DEPAN -->
        <section id="coverSection" class="cover-section">
            <div class="cover-canvas">
                <img src="sampul.jpg" alt="Sampul Undangan" class="media-full" />

                <!-- Nama Tamu Otomatis (Tepat di bawah tulisan "Dear") -->
                <div id="guestName" class="guest-name-text">Tamu Undangan</div>

                <!-- Area Klik Transparan (Tepat di atas gambar tombol "BUKA UNDANGAN") -->
                <button id="openBtn" class="invisible-open-btn" aria-label="Buka Undangan"></button>
            </div>
        </section>

        <!-- 2. DAFTAR VIDEO BERTUMPUK KE BAWAH -->
        <main id="mainInvitation" class="main-invitation hidden">
            <audio id="bgMusic" src="musik.mp3" loop></audio>
            <button id="musicToggle" class="music-btn hidden" aria-label="Toggle Musik">🔊</button>

            <!-- Video 1 (1080x1920 - Langsung dimuat di awal) -->
            <section class="video-slide">
                <video class="scroll-video" src="1.mp4" muted playsinline preload="auto"></video>
            </section>

            <!-- Video 2 (1080x1920 - Langsung dimuat di awal) -->
            <section class="video-slide">
                <video class="scroll-video" src="2.mp4" muted playsinline preload="auto"></video>
            </section>

            <!-- Video 3 (Ukuran panjang 1080x3840) -->
            <section class="video-slide tall-slide">
                <video class="scroll-video" src="3.mp4" muted playsinline preload="none"></video>
            </section>

            <!-- Video 4 (Ukuran kotak 1080x1080 + Countdown di dalam kotak marun) -->
            <section class="video-slide square-slide">
                <video class="scroll-video" src="4.mp4" muted playsinline preload="none"></video>

                <!-- Angka Countdown Presisi di Atas Tulisan Hari, Jam, Menit, Detik -->
                <div class="countdown-overlay">
                    <span id="cd-days" class="cd-num">00</span>
                    <span id="cd-hours" class="cd-num">00</span>
                    <span id="cd-minutes" class="cd-num">00</span>
                    <span id="cd-seconds" class="cd-num">00</span>
                </div>
            </section>

            <!-- Video 5 (1080x1920 + Area Klik Lokasi Google Maps) -->
            <section class="video-slide">
                <video class="scroll-video" src="5.mp4" muted playsinline preload="none"></video>

                <!-- Tombol Transparan Lokasi Video 5 -->
                <button type="button" class="invisible-map-btn" data-map="https://maps.app.goo.gl/rtP91gwhCDrCsLiH6"
                    aria-label="Buka Lokasi Acara di Google Maps"></button>
            </section>

            <!-- Video 6 (1080x1920 + Area Klik Lokasi Google Maps) -->
            <section class="video-slide">
                <video class="scroll-video" src="6.mp4" muted playsinline preload="none"></video>

                <!-- Tombol Transparan Lokasi Video 6 -->
                <button type="button" class="invisible-map-btn" data-map="https://maps.app.goo.gl/rtP91gwhCDrCsLiH6"
                    aria-label="Buka Lokasi Acara di Google Maps"></button>
            </section>

            <!-- Video 7 (Ukuran panjang 1080x3840) -->
            <section class="video-slide tall-slide">
                <video class="scroll-video" src="7.mp4" muted playsinline preload="none"></video>
            </section>

            <!-- Video 8 (Ukuran kotak 1080x1080 - Wedding Gift + Tombol Copy Rekening) -->
            <section class="video-slide square-slide">
                <video class="scroll-video" src="8.mp4" muted playsinline preload="none"></video>

                <!-- Area Klik Transparan tepat di atas tombol "Copy" pada kartu Mandiri -->
                <button id="copyRekBtn" class="invisible-copy-btn" data-rekening="1660004094181"
                    aria-label="Salin Nomor Rekening"></button>
            </section>

            <!-- Video 9 (Ukuran panjang 1080x3840 + Widget Ucapan & RSVP) -->
            <section class="video-slide tall-slide">
                <video class="scroll-video" src="9.mp4" muted playsinline preload="none"></video>

                <!-- Kotak Ucapan & Konfirmasi Kehadiran (Tepat di dalam frame bunga) -->
                <div class="rsvp-widget">
                    <div class="comment-count"><span id="totalComments">0</span> Comments</div>

                    <!-- Kotak Penghitung Hadir & Tidak Hadir -->
                    <div class="rsvp-stats">
                        <div class="stat-box hadir">
                            <strong id="countHadir">0</strong>
                            <span>Hadir</span>
                        </div>
                        <div class="stat-box tidak-hadir">
                            <strong id="countTidakHadir">0</strong>
                            <span>Tidak Hadir</span>
                        </div>
                    </div>

                    <!-- Form Input Ucapan -->
                    <form id="rsvpForm" class="rsvp-form">
                        <input type="text" id="inputNama" placeholder="Nama" required />
                        <textarea id="inputUcapan" rows="3" placeholder="Ucapan" required></textarea>
                        <select id="inputKehadiran" required>
                            <option value="" disabled selected>Konfirmasi Kehadiran</option>
                            <option value="Hadir">Hadir</option>
                            <option value="Tidak Hadir">Tidak Hadir</option>
                        </select>
                        <button type="submit" id="submitRsvpBtn" class="btn-kirim">Kirim</button>
                    </form>

                    <!-- Daftar Ucapan Tamu (Bisa di-scroll di dalam kotak) -->
                    <div id="commentList" class="comment-list">
                        <p class="loading-text">Memuat ucapan...</p>
                    </div>
                </div>
            </section>

            <!-- Video 10 (1080x1920) -->
            <section class="video-slide">
                <video class="scroll-video" src="10.mp4" muted playsinline preload="none"></video>
            </section>

        </main>

        <!-- Notifikasi Toast saat nomor rekening disalin -->
        <div id="copyToast" class="copy-toast">Nomor rekening disalin: 1660004094181</div>

    </div>

    <script src="script.js"></script>
</body>

</html>
